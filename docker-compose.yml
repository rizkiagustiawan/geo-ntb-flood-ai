version: '3.8'

services:
  flood-ai:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src:/app/api
      - RTK_BIN=${RTK_BIN:-}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - API_KEYS=${API_KEYS:-}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
      - report_cache:/tmp/reports
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always

  worker:
    build: .
    command: celery -A api.tasks worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src:/app/api
      - RTK_BIN=${RTK_BIN:-}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
      - report_cache:/tmp/reports
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "api.tasks", "inspect", "ping", "--timeout=5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: always

  celery-beat:
    build: .
    command: celery -A api.tasks beat --loglevel=info
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src:/app/api
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  report_cache:
  redis_data:
