global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aeco-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['flood-ai:8000']
        labels:
          service: 'aeco-api'
          environment: 'production'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
